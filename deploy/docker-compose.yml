# SCH-017 可选自部署：把整个静态站点用 nginx 跑在自己服务器上。
# 官方推荐仍是 GitHub Pages（免运维）；本文件给需要内网/私有化部署的用户。
# 用法：docker compose up -d
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
