server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 健康检查端点：docker compose healthcheck 用
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # 静态资源长缓存
  location ~* \.(js|css|png|jpg|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
