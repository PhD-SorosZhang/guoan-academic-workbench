name: 每日文章收录与评价

on:
  schedule:
    # 北京时间 06:30 = UTC 22:30 (前一天)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定收录日期 (YYYY-MM-DD，默认今天)'
        required: false
        default: ''
      sources:
        description: '数据源 (ncpssd,rss)'
        required: false
        default: 'ncpssd,rss'
      backfill_days:
        description: '补抓最近N天'
        required: false
        default: '0'
  repository_dispatch:
    types: [daily-archive-trigger]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 仅使用标准库，无需额外依赖
          python -c "import sqlite3, json, urllib.request; print('标准库就绪')"

      - name: 确定运行日期
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(TZ='Asia/Shanghai' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"

      - name: 运行每日流水线
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          SOURCES="${{ github.event.inputs.sources || 'ncpssd,rss' }}"
          echo "运行日期: $DATE"
          echo "数据源: $SOURCES"
          python scripts/run_pipeline.py --date "$DATE" --sources "$SOURCES"

      - name: 补抓（如指定）
        if: ${{ github.event.inputs.backfill_days && github.event.inputs.backfill_days != '0' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          DAYS=${{ github.event.inputs.backfill_days }}
          for i in $(seq 1 $DAYS); do
            BACKDATE=$(TZ='Asia/Shanghai' date -d "$i days ago" +%Y-%m-%d)
            echo "补抓: $BACKDATE"
            python scripts/run_pipeline.py --date "$BACKDATE" --sources "ncpssd,rss" || true
          done

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            DATE="${{ steps.date.outputs.date }}"
            NEW_COUNT=$(python -c "import json; d=json.load(open('data/index.json')); print(d.get('total',0))")
            git commit -m "docs: 每日文章收录 ${DATE} (累计 ${NEW_COUNT} 篇)"
            git push
            echo "已提交并推送"
          fi

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-log-${{ steps.date.outputs.date }}
          path: |
            data/crawled.json
            data/index.json
          retention-days: 30
